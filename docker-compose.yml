services:
  db:
    image: postgis/postgis:16-3.4
    environment: { POSTGRES_USER: agri, POSTGRES_PASSWORD: agri, POSTGRES_DB: agrinexus }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  backend:
    build: ./backend
    env_file: .env
    ports: ["8000:8000"]
    depends_on: [db]
volumes: { pgdata: {} }
